{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="JHMezzomo">
    <title>{% block title %}Blog | JHM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'blog.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'imagenes/favicon_portfolio.ico' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid">
            <div class="logo-brand" onclick="ChangeMode()">JHM</div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'index' %}">Portfolio</a>
                    <a class="nav-link" href="{% url 'blog_index' %}">Blog</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid page-layout bordes-verdes blog-shell">
        <main class="blog-content">
            {% block page_title %}{% endblock page_title %}
            {% block page_content %}{% endblock page_content %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        function ChangeMode() {
            document.body.classList.toggle("light-mode");
        }
    </script>
</body>
</html>
